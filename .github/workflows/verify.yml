name: Host verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check Markdown links
        run: python tools/verification/check_doc_links.py
      - name: Test Questa log classification
        run: python -m unittest discover -s tests/rtl -p test_questa_log.py
      - name: Compare the recorded board output
        run: >-
          python tools/goldens/compare_prealpha.py
          --case tests/vectors/prealpha/normal_8x16x8 --kind int8
          --actual evidence/vivado/board-prototype/live-gemm/out0.bin
